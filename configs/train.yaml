project:
  name: INFINITY AI
  version: "1.0.0"
  seed: 42

model:
  # Unified multimodal pretrained family. First milestone trains the
  # text-generating Thinker component; pretrained modality encoders remain.
  name_or_path: Qwen/Qwen2.5-Omni-7B
  component: thinker
  trust_remote_code: false
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: float16

data:
  train_file: data/processed/train.jsonl
  validation_file: data/processed/validation.jsonl
  max_seq_length: 1024
  validation_split: 0.05

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/infinity-ai-7b
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0001
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  max_grad_norm: 0.3
  gradient_checkpointing: true
  fp16: true
  bf16: false
  optim: paged_adamw_8bit
  dataloader_num_workers: 2
  report_to: none
